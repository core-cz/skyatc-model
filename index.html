<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkyATC · 离线识别模型</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0e14;
        --fg: #e6edf3;
        --dim: #8b98a9;
        --line: #1e2632;
        --cyan: #4fd1c5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main { width: 100%; max-width: 540px; }
      h1 { margin: 0 0 6px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
      .sub { margin: 0 0 26px; color: var(--dim); font-size: 13px; }
      a.dl {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #0e141c;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.16s;
      }
      a.dl:hover { border-color: var(--cyan); }
      .n { font-weight: 550; }
      .s { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
      dl {
        margin: 24px 0 0;
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px 14px;
        font-size: 12.5px;
      }
      dt { color: var(--dim); }
      dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
      footer { margin-top: 30px; color: var(--dim); font-size: 11.5px; line-height: 1.8; }
      footer a { color: var(--cyan); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>SkyATC · 离线识别模型</h1>
      <p class="sub">Vosk 英文模型，供 SkyATC 在浏览器本地做陆空通话识别。</p>

      <a class="dl" href="./vosk/model.tar.gz" download>
        <span>
          <span class="n">model.tar.gz</span>
          <br />
          <span class="s">41,206,109 字节 · 约 39 MB</span>
        </span>
        <span class="s">下载 ↓</span>
      </a>

      <dl>
        <dt>服务地址</dt>
        <dd>core-cz.github.io/skyatc-model/vosk/model.tar.gz</dd>
        <dt>SHA-256</dt>
        <dd>6b4d79ca2d9fc7a6a3284325773dd0e151f12d42f853e6993b63c074dde16825</dd>
      </dl>

      <footer>
        这个仓库只托管模型文件，应用本身在
        <a href="https://skyatc.pages.dev">skyatc.pages.dev</a>。<br />
        模型来自 Vosk 的英文通用模型（Apache-2.0），仅用于学习与收听爱好者。
      </footer>
    </main>
  </body>
</html>
